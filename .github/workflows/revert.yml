name: Revert Backend

on:
  workflow_dispatch

jobs:
  revert-backend:
    runs-on: self-hosted
    steps:
      - name: Revert backend to previous version
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd ~/prod/smart-home
            git reset --hard HEAD^
            docker compose -f docker-compose-backend.yml up --build -d