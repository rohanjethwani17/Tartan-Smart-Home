name: Revert Backend

on:
  workflow_dispatch

jobs:
  revert-backend:
    runs-on: ubuntu-latest
    # Disabled: self-hosted runner no longer available
    if: false
    steps:
      - name: Revert backend to previous version
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd ~/prod/smart-home
            
            docker tag smart-home-platform:prev smart-home-platform:active
            docker tag smart-home-mysql-container:prev smart-home-mysql-container:active 

            docker compose -f docker-compose-backend.yml up -d